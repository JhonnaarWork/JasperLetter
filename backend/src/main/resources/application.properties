server.port=8081
spring.application.name=jasper-preview-backend

# Tamaño máximo de peticiones para permitir plantillas con imágenes o datos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Orígenes permitidos para CORS (separados por coma). Por defecto, solo el frontend
# Angular en desarrollo. Ajustar en despliegues a otros entornos (ver WebConfig).
app.cors.allowed-origins=http://localhost:4200
